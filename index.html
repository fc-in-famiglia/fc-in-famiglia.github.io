venerdì 18 settembre · 1ª di lega, 5ª di Serie A_\n\n━━━━━━━━━━━━━\n\n📊 *IL TABELLONE DELL'ASTA · CHI HA BRUCIATO I CREDITI*\n\n🥇 *FROST PALACE* · *1000* spesi _(zero rimasti)_\n🥈 *CriPro Team* · *998* spesi\n🥉 *Fonzie Team* · *995* spesi\n4. *Raimon junior High* · *980*\n5. *New Team* · *971*\n6. *ALLEGRI ma non troppo* · *968*\n7. *TUTTO PRECISO* · *963*\n8. *RONALDINHO GAUCHO* · *928*\n\nOtto squadre, 1.000 crediti a testa, 200 giocatori assegnati e un'asta che ha raccontato due filosofie opposte. Da una parte chi ha puntato tutto su un nome solo: *FROST PALACE* ha bruciato *466* crediti per *Malen* e *Fonzie Team* addirittura *467* per *Lautaro Martinez*, quasi metà budget in un colpo solo. Dall'altra parte *New Team*, che non ha mai superato quota *98*: venticinque giocatori e nessuna stella, il manifesto della spesa democratica.\n\nIl dato che pesa davvero è un altro: *RONALDINHO GAUCHO* ha chiuso l'asta con *72* crediti ancora in tasca. In una lega dove ogni credito risparmiato è un giocatore non comprato, è una scelta che andrà giustificata sul campo. _Il campionato dirà chi aveva ragione._\n\n━━━━━━━━━━━━━\n\n🔴 *FROST PALACE · TUTTO SULLE SPALLE DELL'OLANDESE*\nAsta chirurgica e spericolata insieme: *466* crediti su *Malen*, che dopo tre giornate guida la classifica marcatori con *5 gol*. Intorno, un impianto low cost ben fatto: *Vicario* in porta a *88*, *Orsolini* a *99*, *Pulisic* a *55*, *Da Cunha* a *52*, difesa costruita a spiccioli con *Couto* a *38* e *Solet* a *26*. Il problema è la panchina d'attacco: dietro l'olandese ci sono *Adams C.* a *27* e *Laurientè* a *16*. _Se Malen si ferma, si ferma tutto._\n\n━━━━━━━━━━━━━\n\n🔵 *FONZIE TEAM · IL CAPITANO COSTA UN PATRIMONIO*\n*467* crediti per *Lautaro Martinez*: il colpo più caro dell'asta, per un solo credito di differenza sul rivale. Poi la stranezza più discussa della serata, i due portieri titolari: *Butez* a *64* e *Maignan* a *56*, centoventi crediti per una maglia sola. A centrocampo scelte interessanti con *Mora* a *53*, uno dei migliori rendimenti di questo avvio, e *Zaniolo* a *43*. Ma l'attacco dietro al capitano è una distesa desolante: *Scamacca* a *76* e poi il vuoto. _Fattore capitano o niente._\n\n━━━━━━━━━━━━━\n\n⚫ *CRIPRO TEAM · TRE NOMI E UN BUDGET FINITO*\n*Thuram* a *290*, *Dimarco* a *180*, *Gonçalo Ramos* a *145*: seicentoquindici crediti in tre giocatori. Con il modificatore difesa attivo, il terzino nerazzurro può ripagare l'investimento, e *Carnesecchi* a *85* è una garanzia tra i pali. Il conto però lo paga il centrocampo: dopo *Rabiot* a *79* si scende subito a *Bernabè* a *32* e *Cissè* a *25*. _Reparto da puntellare al primo mercato utile._\n\n━━━━━━━━━━━━━\n\n🟢 *RAIMON JUNIOR HIGH · L'ASTA DEL BUON SENSO*\nNessuna follia, quattro giocatori sopra i cento crediti e una rosa che sta in piedi da sola. *Pio Esposito* a *184*, *Douvikas* a *159*, *Frattesi* a *102* (già *3 gol* in tre partite dalla Lazio) e *Josep Martinez* a *101* in porta. Dietro, *Bremer* a *70* e *Bastoni* a *40*. E poi la chicca: *Kamara* dell'Udinese preso a *3* crediti, con *2 gol* già in cascina da difensore. _La squadra più equilibrata della lega, senza discussione._\n\n━━━━━━━━━━━━━\n\n🟡 *TUTTO PRECISO · IL NOME NON MENTE*\n*Nico Paz* a *245* e *Hojlund* a *216* sono i due pilastri, *Davis* a *114* la terza punta di lusso, *Svilar* a *97* un portiere da modificatore. Ma il capolavoro è in fondo alla lista: *Kvernadze* del Frosinone pagato *1* credito, con una media voto da top venti del campionato dopo tre giornate. _Chi si chiama così, l'asta la prepara a tavolino._\n\n━━━━━━━━━━━━━\n\n🟠 *ALLEGRI MA NON TROPPO · DUECENTO E DUECENTO*\nDue colpi allo stesso prezzo, *Calhanoglu* a *200* e *Dybala* a *200*, con la Joya che viaggia su una media da terzo posto assoluto in Serie A. Aggiungi *Diao* a *115*, *Mastantuono* a *79* e *Molina* a *77* ed esce la rosa con l'attacco più profondo del lotto: *Pinamonti* a *42*, *Yildiz* a *40*, *Noslin* a *36*. _Poca poesia, tanta sostanza._\n\n━━━━━━━━━━━━━\n\n🟣 *NEW TEAM · NESSUNO SOPRA I CENTO*\nL'unica squadra della lega senza un solo giocatore in tripla cifra. *Kean* a *98*, *Woltemade* a *97*, *Zaccagni* a *92*, *Berardi* a *92*, *De Bruyne* a *87*, *Conceicao* a *76*, *Pellegrino* a *74*: una rosa tutta di seconde linee di lusso. E in mezzo il colpo che può cambiare la stagione: *Raimondo* del Frosinone a *45* crediti, *4 gol* in tre giornate e secondo posto nella classifica marcatori. _Niente fuoriclasse, undici titolari veri._\n\n━━━━━━━━━━━━━\n\n⚪ *RONALDINHO GAUCHO · L'ASTA PRUDENTE*\n*Baturina* a *220* è la scommessa più coraggiosa del lotto, e il croato del Como ha già trovato *2 gol*. Poi una batteria d'attacco larga ma senza bomber conclamati: *Krstovic* a *97*, *Simeone* a *93*, *Kolo Muani* a *75*. Dietro, *Wesley* a *80* e *Akanji* a *37* danno solidità al modificatore. Restano quei *72* crediti mai spesi. _Un difensore titolare in più ci stava._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · L'ASTA DEI DUE MONDI*\nIl numero che riassume tutto è *1*. Un solo credito separa *Lautaro Martinez* (*467*, Fonzie Team) da *Malen* (*466*, FROST PALACE), i due acquisti più costosi nella storia recente della lega. Due squadre hanno investito quasi metà del patrimonio su un uomo, scommettendo sul fattore capitano. Nello stesso momento, in un'altra stanza della stessa asta, *New Team* comprava otto giocatori diversi con la stessa cifra e portava a casa il secondo marcatore del campionato per *45* crediti. Non è una questione di gusto, è una questione di rischio: chi ha il fenomeno vive di picchi, chi ha la rosa larga vive di medie. _La prima giornata in cui Malen o Lautaro resteranno a secco, ne riparliamo._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DELL'ASTA* · *Raimondo* al *New Team* _(45 crediti, 4 gol in 3 giornate)_\n😴 *FLOP DELL'ASTA* · _la panchina d'attacco del Fonzie Team: dietro a Lautaro, quattro giocatori pagati 14 crediti in tutto_\n⚔️ *LA SFIDA DA SEGUIRE* · _Lautaro contro Malen, 467 contro 466: il duello da un credito che deciderà la stagione_\n\n_L'asta è chiusa, i conti sono fatti. Da qui in avanti contano solo i fantavoto: appuntamento al primo tabellino e alla prima panchina sbagliata._"}, {"num": 1.0, "tipo": "pre", "data": "17 settembre 2026", "titolo": "Il duello da un credito", "sommario": "Anteprima della prima giornata: si apre con il duello tra i due acquisti più cari dell'asta.", "punti": ["Roma - Inter mette Malen contro Lautaro", "Il modificatore difesa vuole almeno 4 difensori", "La fascia di capitano vale fino a +4", "Dopo il turno si ferma tutto per tre settimane"], "cover": "img/n1_0_cover_3a6f393c.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 1 · Anteprima 1ª Giornata · Stagione 2026 / 2027_\n_1ª di Lega · 5ª di Serie A · da venerdì 18 a domenica 20 settembre_\n\n━━━━━━━━━━━━━\n\n⚽ *SI COMINCIA · E IL CALENDARIO HA GIÀ SCELTO IL SUO EROE*\nQuattro partite, otto squadre, zero alibi. Dopo un'asta da 7.795 crediti bruciati in una sera, finalmente si gioca. E il sorteggio ha tirato fuori dal cilindro la sfida che tutti aspettavano, subito, alla prima giornata. _Nessuna partenza morbida: si parte in salita._\n\n━━━━━━━━━━━━━\n\n🔴 *FROST PALACE - Fonzie Team · IL DUELLO DA UN CREDITO*\nI due uomini più costosi dell'asta si affrontano davvero, in campo, nello stesso stadio: *Roma - Inter*, sabato *19 settembre* alle *18:00*. *Malen* (466 crediti, 5 gol in campionato) contro *Lautaro Martinez* (467). All'Olimpico ci sono anche *Mora* del Fonzie Team e mezza rosa giallorossa sparsa tra le due squadre. Chi prende il bonus di quel novanta minuti, con ogni probabilità porta a casa la partita. _Novanta minuti per un credito di differenza._\n\n━━━━━━━━━━━━━\n\n🔵 *Raimon junior High - ALLEGRI ma non troppo · I COMO CONTRO I COMO*\nCuriosità del turno: entrambe hanno pescato dal Como, e i lariani giocano a *Frosinone domenica 20 alle 15:00*. *Douvikas* è di Raimon junior High, *Diao* di ALLEGRI: stessa partita, fantasquadre avversarie. Poi c'è il resto: *Frattesi* (3 gol in campionato) impegnato a *Venezia sabato sera*, *Dybala* e *Calhanoglu* entrambi in Roma - Inter. _Due rose equilibrate, decide chi azzecca la difesa._\n\n━━━━━━━━━━━━━\n\n⚫ *RONALDINHO GAUCHO - New Team · IL DERBY DEL FROSINONE*\nAnche qui il Como spacca la partita: *Baturina* (220 crediti) gioca contro *Raimondo* e *Kean*, che sono di New Team. *Frosinone - Como* di domenica alle 15:00 vale doppio, perché Raimondo è il secondo marcatore del campionato con *4 gol* pagati appena *45* crediti. Il resto del New Team è tutta densità: nessun fuoriclasse, undici titolari veri. _La rosa larga contro il colpo di genio._\n\n━━━━━━━━━━━━━\n\n🟢 *TUTTO PRECISO - CriPro Team · IL LUSSO CONTRO IL LUSSO*\n*Hojlund* (216 crediti) apre la domenica alle *12:30* in *Fiorentina - Napoli*, *Thuram* (290) è in campo il sabato all'Olimpico. Due centravanti pagati mezzo patrimonio, due sabati e domeniche diverse. Occhio al *Kvernadze* di TUTTO PRECISO, pagato *1* credito e già tra i migliori rendimenti del campionato. _Chi ha speso di più deve dimostrarlo subito._\n\n━━━━━━━━━━━━━\n\n📅 *IL TURNO IN SERIE A*\n*Venerdì 18* · Monza - Sassuolo in serata\n*Sabato 19* · Bologna - Torino e Udinese - Cagliari alle 15:00, *Roma - Inter* alle 18:00, Venezia - Lazio in serata\n*Domenica 20* · Fiorentina - Napoli alle 12:30, Frosinone - Como e Parma - Genoa alle 15:00, Juventus - Atalanta alle 18:00, Milan - Lecce alle 20:45\nNiente posticipo del lunedì: il turno precede la maxi sosta per le nazionali, quindi domenica alle 22:30 i conti sono già chiusi.\n\n━━━━━━━━━━━━━\n\n⚠️ *IL PROMEMORIA* · attenzione al *modificatore difesa*: scatta solo schierando *almeno 4 difensori* e si calcola sul voto base di portiere più i 3 migliori difensori. Con la difesa a tre si buttano via fino a *5* punti senza accorgersene. E ricordate la fascia: il capitano vale fino a *+4*.\n\n_Dopo questa giornata si ferma tutto per tre settimane. Chi sbaglia adesso, se lo porta dietro fino a ottobre. Formazioni entro il fischio d'inizio della propria partita: buon divertimento a tutti._"}, {"num": 2.0, "tipo": "post", "data": "21 settembre 2026", "titolo": "CriPro Team parte in testa con 89", "sommario": "Otto gol e 89 punti: il CriPro Team travolge TUTTO PRECISO e parte in testa.", "punti": ["CriPro Team primo con 89 e sei gol", "Lautaro capitano da 14, Malen fermo a 6", "Konè entra dalla panchina e fa 14", "Quattro squadre a tre punti in 11 fantapunti"], "cover": "img/n2_0_cover_6206147d.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 2 · 1ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *CRIPRO TEAM PARTE IN TESTA · E LO FA CON 89*\n\n🥇 *CriPro Team* · *3 pt* _(1 - 0 - 0 | 89)_\n🥈 *ALLEGRI ma non troppo* · *3 pt* _(1 - 0 - 0 | 81)_\n🥉 *Fonzie Team* · *3 pt* _(1 - 0 - 0 | 79.5)_\n4. *New Team* · *3 pt* _(1 - 0 - 0 | 78)_\n5. *Raimon junior High* · *0 pt* _(0 - 0 - 1 | 72.5)_\n6. *TUTTO PRECISO* · *0 pt* _(0 - 0 - 1 | 70)_\n7. *FROST PALACE* · *0 pt* _(0 - 0 - 1 | 65.5)_\n8. *RONALDINHO GAUCHO* · *0 pt* _(0 - 0 - 1 | 64.5)_\n\nQuattro partite, quattro vittorie, zero pareggi: la lega si è spaccata in due blocchi netti. Sopra quattro squadre a tre punti racchiuse in appena *11* punti totali, sotto quattro a secco. In vetta *CriPro Team* con *89* e *sei* gol, il punteggio più alto del turno: che a comandare sia il più giovane fantallenatore della lega è già la notizia della stagione. In fondo, simmetria crudele, *FROST PALACE* e *RONALDINHO GAUCHO* appaiate a zero gol segnati. _Il primo weekend ha già scelto da che parte stare._\n\n━━━━━━━━━━━━━\n\n🔴 *IL TORO SPACCA TUTTO · MALEN RESTA A GUARDARE*\n_FROST PALACE 0 - 4 Fonzie Team (65.5 - 79.5)_\nIl duello da un credito è durato novanta minuti e si è chiuso senza storia: *Lautaro Martinez*, capitano, *14* con doppietta e voto *8*, cioè *+3* di fascia. *Malen*, capitano del FROST PALACE, si ferma a *6*. A completare il disastro ci pensa *Muric*, *2.5* tra i pali, un voto che da solo azzera il modificatore difesa: in panchina c'erano *Vicario* a *7.5* e *Romero* a *10*. Non è bastato il magnifico *10.5* di *Pulisic*. _Il capitano più caro d'Italia ha ripagato alla prima uscita._\n\n━━━━━━━━━━━━━\n\n🔵 *MANDAS FA 11.5 E ALLEGRI MA NON TROPPO VOLA*\n_Raimon junior High 2 - 4 ALLEGRI ma non troppo (72.5 - 81)_\nSerata da incorniciare per il portiere di ALLEGRI ma non troppo: *Mandas* chiude a *11.5* tra porta inviolata e rigore parato, il voto più alto della giornata. Dietro di lui *Jimenez* e *Noslin*, entrambi a *10*. Raimon junior High ha invece il problema opposto: il capitano *Esposito* non è nemmeno sceso in campo, la fascia è passata al vice *Douvikas* fermo a *6*, e i *10* di *Bremer* e *Calò* sono finiti sprecati. _Anche ALLEGRI ma non troppo ha sbagliato il capitano, Diao a 5, e ha vinto lo stesso._\n\n━━━━━━━━━━━━━\n\n⚫ *VARELA DA 13 · NEW TEAM PASSEGGIA*\n_RONALDINHO GAUCHO 0 - 4 New Team (64.5 - 78)_\nLa rosa senza fuoriclasse si prende la scena grazie a chi nessuno si aspettava: *Varela* chiude a *13*, *Zaccagni* aggiunge un *10*. Per RONALDINHO GAUCHO invece serata da dimenticare: *Baturina*, pagato *220* crediti e scelto come capitano, si ferma a *5.5*, e *Skorupski* a *4* completa l'opera. In panchina restano *Conceicao* a *9.5* e *Kolo Muani* a *7*. _Ultimo posto per chi all'asta aveva lasciato 72 crediti nel cassetto._\n\n━━━━━━━━━━━━━\n\n🟢 *KONÈ ENTRA E FA 14 · LA GIORNATA DEL CRIPRO TEAM*\n_TUTTO PRECISO 2 - 6 CriPro Team (70 - 89)_\nSuccede tutto dalla panchina: *Cissè* non gioca, entra *Konè* e firma un clamoroso *14*. Accanto a lui *Maldini*, *Moreira* e *Rabiot* tutti a *10*, più il capitano *Ramos* a *8*. TUTTO PRECISO non demerita con *Politano* a *7.5*, ma il *4.5* di *Carnesecchi* dall'altra parte non ferma la valanga. E arriva la beffa: *Kvernadze*, il difensore pagato *1* credito che avevamo indicato come affare dell'asta, ha fatto *9.5*. In panchina. _Il più piccolo della lega guida la classifica, e non per caso._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · LE PANCHINE D'ORO*\nIl conto di chi è rimasto seduto fa male a guardarlo: *Kvernadze 9.5*, *Palmisani 10*, *Romero 10*, *Conceicao 9.5*, *Vicario 7.5*, *Kolo Muani 7*. Quasi sessanta punti lasciati fuori dal campo in una giornata sola, mentre in campo giravano voti da 5. Con le soglie di questa lega, dove ogni *4* punti vale un gol, sono risultati ribaltati. _Non si perde per sfortuna: si perde il venerdì sera, quando si compila la formazione._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DI GIORNATA* · *Lautaro Martinez* _(14, capitano, doppietta)_\n🥈 *MENZIONE* · *Konè* _(14 entrando dalla panchina)_\n😴 *FLOP DI GIORNATA* · *Muric* _(2.5, e con lui il modificatore del FROST PALACE)_\n⚔️ *LA SFIDA DA SEGUIRE* · _quattro squadre a tre punti in 11 punti totali: basta un turno storto e la vetta cambia padrone_\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · TRE SETTIMANE DI NULLA*\nSi ferma tutto per la maxi sosta: niente campionato nei weekend del *27 settembre* e del *4 ottobre*. La *2ª giornata* di lega coincide con la *6ª di Serie A*, da *sabato 10* a *lunedì 12 ottobre*. Il piatto forte è *Como - Roma*, domenica 11 alle *12:30*, che mette di fronte mezza lega. _Tre settimane per studiare la formazione: stavolta niente scuse._"}, {"num": 2.5, "tipo": "S", "data": "23 settembre 2026", "titolo": "Mercato aperto", "sommario": "Speciale mercato: solo scambi fino al 30 giugno, con 197 crediti ancora in circolazione.", "punti": ["Solo scambi tra squadre della lega", "Ammesso il conguaglio in crediti", "Nessuno svincolato acquistabile", "Aperto fino al 30 giugno 2027"], "cover": "img/n2_5_cover_541d08ab.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero speciale · Mercato · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n🔁 *IL MERCATO È APERTO · E RESTA APERTO PER NOVE MESI*\nDal *13 settembre* al *30 giugno 2027* si può trattare. Nessuna finestra, nessuna scadenza intermedia: da oggi fino alla fine della stagione ognuno può bussare alla porta di chiunque. Le rose sono uscite dall'asta com'erano, con i loro buchi e i loro sprechi, e dopo una giornata sola qualche difetto è già venuto a galla. _Adesso si aggiusta._\n\n━━━━━━━━━━━━━\n\n📋 *LE REGOLE IN TRE RIGHE*\nSi fanno *solo scambi* tra squadre della lega: nessuno può comprare svincolati, quindi ogni giocatore che entra deve arrivare da un'altra rosa. È ammesso il *conguaglio in crediti* per pareggiare il valore di uno scambio squilibrato. In totale restano *197* crediti in circolazione, ma sono distribuiti malissimo: *72* stanno in una cassa sola, e due squadre ne hanno praticamente zero. _Chi non ha crediti tratta solo alla pari._\n\n━━━━━━━━━━━━━\n\n🏪 *LE VETRINE · CHI HA COSA E CHI CERCA COSA*\n\n🟡 *RONALDINHO GAUCHO* · *72 crediti*\nHa sei attaccanti veri e tre portieri che messi insieme costano *27* crediti. Krstovic, Simeone, Kolo Muani, Castro, Soulè e Beto non possono giocare tutti insieme. _Merce da vendere e soldi per comprare: è il vero protagonista di questo mercato._\n\n🟢 *TUTTO PRECISO* · *37 crediti*\nSettecento crediti spesi in tre nomi (Paz, Hojlund, Davis) e poi un centrocampo che dopo Politano scende a picco. Ha Dovbyk e Piccoli che scaldano la panchina. _Cede un attaccante, cerca chi gli riempie la mediana._\n\n⚫ *ALLEGRI MA NON TROPPO* · *32 crediti*\nL'attacco più profondo della lega, sei nomi tutti schierabili. Ma dopo Calhanoglu e Mastantuono il centrocampo è una fila di uno e due crediti. _Stesso problema di TUTTO PRECISO, stessa soluzione: una punta in uscita._\n\n🔴 *NEW TEAM* · *29 crediti*\nOtto centrocampisti di livello vero e una difesa che vale *55* crediti in tutto, la più povera della lega. Con il modificatore attivo è un salasso a ogni giornata. _Ha il reparto più forte da cui pescare e il più debole da sistemare._\n\n🔵 *RAIMON JUNIOR HIGH* · *20 crediti*\nLa rosa più equilibrata all'asta, e si vede. L'unico buco è il terzo attaccante: dietro Pio Esposito e Douvikas ci sono De Ketelaere, Colombo e Bowie. _Può cedere un centrocampista senza sentirlo._\n\n⚪ *FONZIE TEAM* · *5 crediti*\nButez e Maignan entrambi titolari, centoventi crediti per una maglia sola. E dietro Lautaro e Scamacca il vuoto assoluto: quattro attaccanti pagati *14* crediti in tutto. _Il portiere in più è la merce di scambio più ovvia della lega._\n\n⚫ *CRIPRO TEAM* · *2 crediti*\nPrimo in classifica, ma il centrocampo dopo Rabiot è una lotteria: Bernabè, Cissè, Moreira e poi spiccioli. Il 14 di Konè è stato un colpo di fortuna, non un piano. _Cassa vuota: può trattare solo alla pari._\n\n🟣 *FROST PALACE* · *0 crediti*\nHa bruciato tutto all'asta e oggi non ha un solo credito per conguagliare. Otto difensori dignitosi in rosa e un attacco appeso a Malen. _Scambi puri o niente._\n\n━━━━━━━━━━━━━\n\n📣 *VOCI DI MERCATO*\n_Tutte rigorosamente inventate, ma con una logica dietro._\n\n*RONALDINHO GAUCHO - FONZIE TEAM.* Il primo ha le punte e non ha i portieri, il secondo ha due portieri titolari e l'attacco vuoto. Una punta contro un portiere, con qualche credito a sistemare la differenza. _Lo scambio si scrive da solo._\n\n*NEW TEAM - FROST PALACE.* Uno ha otto centrocampisti e nessun difensore, l'altro ha otto difensori e nessun attaccante oltre Malen. Un difensore contro una punta di scorta. _L'unico problema è che FROST PALACE non ha un credito per arrotondare._\n\n*RAIMON JUNIOR HIGH - TUTTO PRECISO.* A Raimon junior High serve il terzo attaccante, a TUTTO PRECISO serve chiunque sappia giocare a centrocampo. Una mezzala contro una punta. _La trattativa più semplice del listino._\n\n━━━━━━━━━━━━━\n\n📊 *LA FOTOGRAFIA*\nDopo una giornata comanda *CriPro Team* con *89* punti, davanti a un gruppo di quattro squadre appaiate a tre punti. In fondo *FROST PALACE* e *RONALDINHO GAUCHO*, entrambe a secco. Curiosità che vale tutto il mercato: l'ultima in classifica è la prima per crediti in cassa.\n\n━━━━━━━━━━━━━\n\n💰 *IL PIÙ RICCO* · *RONALDINHO GAUCHO* _(72 crediti)_\n🪙 *IL PIÙ AL VERDE* · *FROST PALACE* _(0 crediti)_\n\n_Il campionato riprende il 10 ottobre: ci sono tre settimane per trattare con calma. Chi fa la prima mossa?_"}, {"num": 3, "tipo": "pre", "data": "8 ottobre 2026", "titolo": "Ci siamo, si torna in pista", "sommario": "Edizione straordinaria dopo la sosta: la pagella delle nazionali, chi torna intero e chi no, e le quattro sfide della 2ª giornata.", "punti": ["Lautaro in ballottaggio con Bonny in Inter - Parma", "Fonzie Team senza Jones C., Stones e Zaniolo", "Malen torna a disposizione per Como - Roma", "CriPro Team in testa, quattro squadre a 3"], "cover": "img/n3_cover_b01cedd8.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 3 · Edizione straordinaria · Anteprima 2ª Giornata · Stagione 2026 / 2027_\n\n🚨 *CI SIAMO: SI TORNA IN PISTA*\n\nDiciannove giorni a guardare le nazionali, a contare i minuti degli altri e a sperare che nessuno dei nostri tornasse zoppo. Speranza tradita: le otto rose rientrano con qualche acciacco in più e con un ballottaggio che fa tremare mezza lega. Da sabato alle *15:00* si torna a fare sul serio. Davanti c'è *CriPro Team* con *89* punti totali, poi *ALLEGRI ma non troppo*, *Fonzie Team* e *New Team*, tutte a *3 punti*; dietro quattro squadre ancora a zero. _Basta amichevoli: torna il divertimento vero._\n\n🩺 *LA PAGELLA DELLA SOSTA*\n\nPrima delle partite, il bollettino: chi torna intero e chi no, dal meglio al peggio.\n\n✅ *CriPro Team* · Perde solo *Kevin Carlos*, lesione al quadricipite e rientro a novembre: pagato *2 crediti*, nessun dramma. *Dimarco* è recuperato e si candida a partire titolare con il Parma.\n✅ *ALLEGRI ma non troppo* · *Yildiz* è operato al piede e se ne riparla a dicembre. La buona notizia è *Calhanoglu*: rientrato in gruppo, dovrebbe esserci.\n🟡 *RONALDINHO GAUCHO* · *Zambo Anguissa* in forte dubbio per una lesione all'adduttore, *McTominay* aspetta l'idoneità dopo una lieve aritmia. In compenso *Provedel* potrebbe prendersi la porta dell'Inter.\n🟡 *TUTTO PRECISO* · *Cristante* salta Como - Roma per un'infiammazione al ginocchio, *Boga* è fermo fino a novembre e *Idzes* fino alla seconda metà di ottobre. *Dovbyk* e *Tiago Gabriel* sono recuperabili.\n🟡 *FROST PALACE* · *Malen* torna a disposizione dopo il problema al ginocchio. Restano in dubbio *Muric*, uscito acciaccato dalla gara con l'Austria, *Solet* e *Adams C.*; *Gudmundsson A.* ha la spalla lussata fino a novembre e *Grabara* ha chiuso la stagione.\n❌ *New Team* · *Vergara* fuori fino a novembre per una lesione al polpaccio rimediata in Italia - Turchia, *Raimondo* fermo per il tendine d'Achille, *Kean* in dubbio per un affaticamento muscolare. *Meret* si allena in gruppo e prova a tornare tra i pali.\n❌ *Raimon junior High* · Il bollettino più lungo: *Raspadori* con una distrazione al bicipite femorale, *Colombo* fuori fino a fine ottobre per la caviglia, *Locatelli* e *Holm* operati e fermi fino al 2027. E *Martinez Jo.* rischia di perdere il posto all'Inter.\n❌ *Fonzie Team* · La più colpita: fuori *Jones C.* per gli adduttori, *Stones* per i flessori, *Zaniolo* fino a novembre e *Santos A.* fino alla seconda metà di ottobre. E il capitano *Martinez L.*, rientrato stanco dall'Argentina, è in ballottaggio con *Bonny*.\n\n_Diciannove giorni senza giocare, e c'è chi ha perso mezza rosa lo stesso._\n\n━━━━━━━━━━━━━━━\n\n🔴 *LA CAPOLISTA CONTRO I 466 CREDITI DI MALEN*\nCriPro Team vs FROST PALACE\n\nLa prima contro la penultima, ma il pronostico non è scontato. *CriPro Team* esce dalla sosta quasi intatto e ha il blocco Milan, *Rabiot*, *Moreira*, *Ramos G.* e *Bartesaghi*, in campo domenica alle *18:00* a Sassuolo, proprio contro *Muric*, *Esposito Se.* e *Laurientè* degli avversari. FROST PALACE ritrova *Malen*, titolare nelle probabili di Como - Roma domenica alle *12:30*, e spera che *Pulisic* replichi il *10.5* dell'esordio. Il filo che lega tutto è Inter - Parma: *Dimarco*, *Thuram* e forse *Bonny* da una parte, *Romero D.* e *Tourè E.* con il Parma dall'altra. _La sosta ha restituito Malen: adesso deve restituire i crediti._\n\n🔵 *IL SABATO VIOLA E IL DERBY DEL MARADONA*\nALLEGRI ma non troppo vs TUTTO PRECISO\n\nALLEGRI ma non troppo apre il turno con mezza Fiorentina: sabato alle *15:00* a Genova giocano *Mastantuono*, *Ndour*, *Njie*, *Dragusin* e *Jimenez A.*. Poi c'è *Calhanoglu*, rientrato in gruppo e in corsa per la regia dell'Inter, e domenica *Dybala* in Como - Roma. TUTTO PRECISO ha un derby tutto suo sabato alle *20:45*: in Napoli - Frosinone ci sono *Hojlund*, *Rrahmani* e *Politano* da una parte e *Kvernadze*, *1 credito* e *9.5* all'esordio, dall'altra. Senza *Cristante* e *Boga*, a Como - Roma servono *Svilar*, *Mancini* e *Paz N.*. _Il sabato decide già mezzo turno._\n\n⚫ *TERZA CONTRO ULTIMA, CON IL CAPITANO IN BILICO*\nFonzie Team vs RONALDINHO GAUCHO\n\nSulla carta è una partita facile, nella realtà Fonzie Team arriva con l'infermeria piena e il capitano da *467 crediti* che rischia la panchina in Inter - Parma. Per fortuna *Scamacca*, *Bernasconi* e *Rowe* giocano lunedì alle *18:30* contro il Venezia, e domenica sera a Cagliari ci sono *Lucumì* e *Celik*. RONALDINHO GAUCHO, ultima a zero, perde i due del Napoli ma può contare su *Baturina* a Como, *Simeone* lunedì sera e forse *Provedel* titolare all'Inter. _Se Lautaro parte dalla panchina, la partita si riapre da sola._\n\n⚪ *QUARTA CONTRO QUINTA, LA SFIDA DEI PORTIERI*\nNew Team vs Raimon junior High\n\nTutti e due i portieri del Napoli sono di New Team, quindi tra *Meret* e *Milinkovic-Savic V.* la porta del Maradona è comunque coperta. Il vero dubbio è *Kean*, con *Douvikas* favorito per Como - Roma. Domenica alle *15:00* c'è Lazio - Monza, con *Zaccagni* e *Taylor K.* da una parte e *Varela G.*, *13* all'esordio, dall'altra. Raimon junior High conta su *Barella* all'Inter e su *Bremer* e *McKennie* a Cagliari, ma rischia di perdere *Martinez Jo.*, *101 crediti*, con *Provedel* favorito tra i pali; in compenso *Palmisani* dovrebbe giocare titolare con il Frosinone al Maradona. _Chi vince sale a tre punti, chi perde scivola nel gruppone a zero._\n\n📉 *IL CASO · IL BALLOTTAGGIO DA 466 CREDITI*\n\nInter - Parma, sabato alle *18:00*, tocca tutte e otto le squadre della lega. Il cuore è in attacco: *Martinez L.*, *467 crediti* e capitano di Fonzie Team, contro *Bonny*, pagato *1 credito* da CriPro Team. Rientrato stanco dall'Argentina, Lautaro parte meno favorito. Anche in porta c'è un derby di lega: *Provedel* di RONALDINHO GAUCHO in vantaggio su *Martinez Jo.* di Raimon junior High. Intorno, *Calhanoglu* e *Bisseck* per ALLEGRI ma non troppo, *Zielinski* per New Team, *Diego Carlos* per TUTTO PRECISO e *Romero D.* per FROST PALACE.\n\n_Una scelta di Chivu può spostare più punti di tutta la sosta._\n\n📌 *PROMEMORIA* · Formazioni da schierare prima di Genoa - Fiorentina, sabato alle *15:00*. Con il modificatore difesa servono almeno *4 difensori* più il portiere. Occhio alla fascia: con Lautaro in bilico, il capitano va scelto con cura. Il turno si chiude lunedì sera con Torino - Udinese.\n\n🏆 DA SEGUIRE · *Bonny* _(pagato 1 credito, può prendersi l'attacco dell'Inter)_\n😴 OSSERVATO SPECIALE · *Martinez L.* _(467 crediti, capitano a rischio panchina)_\n⚔️ LA SFIDA · _CriPro Team contro FROST PALACE, la capolista contro Malen_"}, {"num": 4, "tipo": "post", "data": "13 ottobre 2026", "titolo": "CriPro Team e Fonzie Team a punteggio pieno", "sommario": "Riepilogo della 2ª giornata: due vittorie e due pareggi, De Bruyne da 13.5, e un 15 rimasto in panchina.", "punti": ["CriPro Team e Fonzie Team a 6 punti", "De Bruyne 13.5, MVP di giornata", "Krstovic fa 15 e resta in panchina", "Malen 3.5 da capitano"], "cover": "img/n4_cover_8a52a0af.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 4 · 2ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *DUE A PUNTEGGIO PIENO · E UN 15 RIMASTO SEDUTO*\n\n🥇 *CriPro Team* · *6 pt* _(2 - 0 - 0 | 168.5)_\n🥈 *Fonzie Team* · *6 pt* _(2 - 0 - 0 | 158.5)_\n🥉 *ALLEGRI ma non troppo* · *4 pt* _(1 - 1 - 0 | 155.5)_\n4. *New Team* · *4 pt* _(1 - 1 - 0 | 151)_\n5. *TUTTO PRECISO* · *1 pt* _(0 - 1 - 1 | 145)_\n6. *Raimon junior High* · *1 pt* _(0 - 1 - 1 | 142.5)_\n7. *FROST PALACE* · *0 pt* _(0 - 0 - 2 | 136.5)_\n8. *RONALDINHO GAUCHO* · *0 pt* _(0 - 0 - 2 | 131.5)_\n\nDue vittorie e due pareggi, e la lega si divide in tre fasce. In testa *CriPro Team* e *Fonzie Team* a punteggio pieno, con il CriPro che tiene il miglior totale a *168.5*. In mezzo *ALLEGRI ma non troppo* e *New Team*, fermate sul pari da chi stava a zero. In fondo *FROST PALACE* e *RONALDINHO GAUCHO*, ancora senza punti e con *tre* gol fatti in due. La notizia del turno però sta in panchina: un *15* che non è mai entrato in campo. _Dopo tre settimane di sosta, c'è chi ha dimenticato di guardare la panchina._\n\n━━━━━━━━━━━━━\n\n🔴 *OSMAJIC DA UN CREDITO FA 11.5 · E KRSTOVIC GUARDA DALLA PANCHINA*\n_Fonzie Team 4 - 1 RONALDINHO GAUCHO (79 - 67)_\nIl capitano *Scamacca* non gioca, la fascia passa a *Rowe* e il Fonzie Team vince lo stesso, grazie a chi costava niente: *Osmajic*, pagato *1* credito, chiude a *11.5*, e *Lang*, entrato dalla panchina, fa *10* come *Tavares*. *Lautaro* gioca e si ferma a *6*: il ballottaggio con Bonny non c'era, ma il gol nemmeno. Dall'altra parte il disastro ha un nome solo: *Krstovic* fa *15* e resta in panchina, mentre il capitano *Beto* porta a casa un *5.5*. Tre titolari senza voto, tre riserve entrate con il minimo. _Quindici punti seduti in tribuna: il RONALDINHO GAUCHO ha perso prima del fischio d'inizio._\n\n━━━━━━━━━━━━━\n\n🔵 *THURAM DA CAPITANO · MALEN DA 3.5*\n_CriPro Team 4 - 2 FROST PALACE (79.5 - 71)_\nLa capolista passa anche la seconda, e stavolta con la fascia giusta: *Thuram* capitano fa *10* e vale *+2*, *Rabiot* replica il *10* dell'esordio e *Isaksen*, pagato *1* credito, ne aggiunge un altro. Il FROST PALACE gioca una partita da *71* che in altre giornate basta, con *Orsolini* a *10.5* e *Ramon* a *7*, ma il capitano affonda tutto: *Malen*, *466* crediti, chiude a *3.5* e la fascia diventa un malus. Seconda sconfitta, seconda volta che il più caro della rosa non segna. _Il CriPro Team ha pagato Bonny un credito e Thuram 290: oggi hanno vinto tutti e due._\n\n━━━━━━━━━━━━━\n\n⚫ *DE BRUYNE DA 13.5 · MA VASQUEZ DA 3 REGALA IL PARI*\n_New Team 2 - 2 Raimon junior High (73 - 70)_\nIl voto più alto della giornata è di *De Bruyne*, *13.5*, e dovrebbe bastare per vincere. Non basta perché *Vasquez* prende *3*, il peggior voto del turno, e in panchina resta *Sucic* con un *10*. Il Raimon junior High ringrazia e porta a casa il primo punto senza *Bastoni* e *Barella*, mai entrati: al loro posto *N'Dicka* ed *Ederson*, *6* a testa, mentre *Modric* a *7.5* guarda dalla panchina. *Martinez Jo.* tiene il posto all'Inter e fa *7*, come il capitano *Esposito*. _Un 13.5 in campo e un 3 accanto: il New Team ha vinto e perso nella stessa partita._\n\n━━━━━━━━━━━━━\n\n🟢 *75 PUNTI E UN PUNTO SOLO · TUTTO PRECISO FA PIÙ DELL'AVVERSARIO E PAREGGIA*\n_ALLEGRI ma non troppo 3 - 3 TUTTO PRECISO (74.5 - 75)_\nIl pareggio più strano del turno: TUTTO PRECISO fa *75*, mezzo punto più di ALLEGRI ma non troppo, e si prende tre gol come l'avversario. *Svilar* non gioca ed entra *Gollini* dalla panchina con un *7.5*, *Ekkelenkamp*, *30* crediti, fa *10*, il capitano *Hojlund* chiude a *6.5*. ALLEGRI risponde con *Calhanoglu* a *10* e *Noslin* a *9.5*, ma lascia *Pinamonti* in panchina con un altro *10*. Con la soglia dei *78* a un passo per entrambe, nessuno la passa. _Mezzo punto in più non vale un gol: primo punto per TUTTO PRECISO, e primo rimpianto._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · LO SFIGOMETRO SEGNA TUTTO PRECISO*\nDa questa settimana sul sito c'è lo Sfigometro: ogni squadra gioca contro tutte le altre, ogni giornata, e la differenza tra i punti veri e quelli meritati dice chi ringrazia il calendario e chi lo maledice. Dopo due turni il più sfortunato è *TUTTO PRECISO*: *75* punti sabato bastavano per battere cinque squadre su sette, e gli sono valsi un pari. I più fortunati sono *Fonzie Team* e *New Team*, a *+1.3*: hanno vinto all'esordio contro le due squadre più deboli del turno. _La classifica dice una cosa, la lancetta un'altra: ma i punti li dà la classifica._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DI GIORNATA* · *De Bruyne* _(13.5, il voto più alto del turno)_\n🥈 *MENZIONE* · *Osmajic* _(11.5 da un credito)_\n😴 *FLOP DI GIORNATA* · *Malen* _(3.5 da capitano, 466 crediti)_\n🪑 *LA PANCHINA D'ORO* · *Krstovic* _(15, mai entrato)_\n⚔️ *LA SFIDA DA SEGUIRE* · _CriPro Team e Fonzie Team a punteggio pieno: chi sbaglia per primo lascia la vetta_\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · SI GIOCA GIÀ VENERDÌ*\nLa *3ª giornata* di lega coincide con la *7ª di Serie A*, e stavolta si apre di venerdì: *Frosinone - Sassuolo* il *16 ottobre* alle *20:45*, quindi le formazioni vanno schierate prima. Sabato *Bologna - Inter* alle *18:00* e *Roma - Genoa* alle *20:45*, domenica *Milan - Atalanta* alle *18:00* e *Juventus - Lazio* alle *20:45*, chiusura lunedì con *Parma - Torino*. _Chi lascia un 15 in panchina di venerdì, lo ricorda fino a lunedì._"}, {"num": 5, "tipo": "post", "data": "20 ottobre 2026", "titolo": "New Team fa 92.5 e ne segna sette", "sommario": "Riepilogo della 3ª giornata: il 7 - 0 di New Team sul Fonzie Team, Raimondo da 17.5, e CriPro Team e New Team in testa a 7.", "punti": ["New Team 7 - 0 al Fonzie Team con 92.5", "Raimondo tripletta e 17.5", "CriPro Team e New Team in testa a 7", "Prima vittoria del FROST PALACE"], "cover": "img/n5_cover_9e3e0f5c.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 5 · 3ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *SETTE GOL E UN RECORD · IN TESTA SI VA IN DUE*\n\n🥇 *CriPro Team* · *7 pt* _(2 - 1 - 0 | 246)_\n🥈 *New Team* · *7 pt* _(2 - 1 - 0 | 243.5)_\n🥉 *Fonzie Team* · *6 pt* _(2 - 0 - 1 | 223)_\n4. *ALLEGRI ma non troppo* · *4 pt* _(1 - 1 - 1 | 223)_\n5. *FROST PALACE* · *3 pt* _(1 - 0 - 2 | 207)_\n6. *TUTTO PRECISO* · *2 pt* _(0 - 2 - 1 | 216)_\n7. *Raimon junior High* · *2 pt* _(0 - 2 - 1 | 213.5)_\n8. *RONALDINHO GAUCHO* · *1 pt* _(0 - 1 - 2 | 208.5)_\n\nLa terza giornata cambia la testa della classifica e svuota il fondo: dopo tre turni nessuno è più a zero. *New Team* fa *92.5*, il punteggio più alto della stagione, ne segna sette al *Fonzie Team* e aggancia *CriPro Team* a *7 punti*, con appena *2.5* punti totali di distacco. Il Fonzie Team scivola terzo, *FROST PALACE* vince la prima e *RONALDINHO GAUCHO* prende il primo punto. In mezzo, due pareggi: uno deciso da mezzo punto, l'altro finito *71* pari. _Tre giornate, otto squadre a punti: il campionato vero comincia adesso._\n\n━━━━━━━━━━━━━\n\n🔴 *SETTE A ZERO · RAIMONDO FA TRIPLETTA E 17.5*\n_Fonzie Team 0 - 7 New Team (64.5 - 92.5)_\nUna partita senza storia, e un record. *Raimondo*, pagato *45* crediti, fa tripletta al Sassuolo e chiude a *17.5*, il voto più alto della stagione; il capitano *Varela* aggiunge *15.5*, *Zielinski* *8* e *Zaccagni* *7*. Totale *92.5*: battuto l'*89* del CriPro Team alla prima giornata. Dall'altra parte il Fonzie Team gioca senza *Lautaro*, nemmeno in distinta, perde per strada *Spence* e *Lang* e trova solo il *8* di *Tavares*; *Maignan* si ferma a *4.5* e il capitano *Scamacca* a *6*. E in panchina resta *Gaetano* con un *10*. I *64.5* punti eguagliano il punteggio più basso della stagione. _Il Fonzie Team era secondo a punteggio pieno: in novanta minuti ha preso più gol che in tutta la stagione._\n\n━━━━━━━━━━━━━\n\n🔵 *MEZZO PUNTO DALLA VITTORIA · E CAPRILE FA 1.5*\n_RONALDINHO GAUCHO 3 - 3 CriPro Team (77 - 77.5)_\nIl CriPro Team si ferma a *77.5*, mezzo punto sotto la soglia dei *78* che valeva il quarto gol e la vittoria. Eppure in campo c'era tutto: *Rabiot* *11*, terza partita di fila da almeno *10*, *Isaksen* *10*, *Thuram* *9.5*, *Moreira* *8*. Il problema è in porta, dove *Caprile* chiude a *1.5* con *Falcone* (*7*) e *Carnesecchi* (*6.5*) seduti in panchina. RONALDINHO GAUCHO ringrazia e prende il primo punto della stagione con *Simeone* a *14* e il capitano *Castro*, pagato *40* crediti, a *10*, nonostante tre titolari senza voto, *Baturina* compreso. _Mezzo punto per il primo posto in solitaria, mezzo punto per il primo punto in classifica._\n\n━━━━━━━━━━━━━\n\n⚫ *LA PRIMA DEL FROST PALACE · ANCHE SENZA MALEN*\n_FROST PALACE 2 - 1 ALLEGRI ma non troppo (70.5 - 67.5)_\n*Malen* non gioca e il FROST PALACE vince la sua prima partita. Fascia a *Pulisic* (*6.5*), il migliore è *Esposito Se.* con *8*, e dalla panchina entra *Gila* con un *10* al posto di *Couto*. Il FROST PALACE passa la soglia dei *70* per mezzo punto, nonostante il *3* di *Vicario* tra i pali. ALLEGRI ma non troppo ha lo stesso problema in porta, *Okoye* a *3.5* con *Mandas* a *7* in panchina, e si ferma a *67.5*: *Lulli* entra e fa *10*, ma il capitano *Mastantuono* chiude a *5.5* e *Calhanoglu* a *6*. _Il FROST PALACE ha vinto la partita in cui il suo uomo da 466 crediti è rimasto a guardare._\n\n━━━━━━━━━━━━━\n\n🟢 *71 A 71 · PARI FINO AL MEZZO PUNTO*\n_TUTTO PRECISO 2 - 2 Raimon junior High (71 - 71)_\nStesso punteggio al mezzo punto, stesso numero di gol. TUTTO PRECISO trova finalmente il suo acquisto più caro: *Paz N.*, *245* crediti e la fascia al braccio, fa *11*; *Gollini*, *Tiago Gabriel* e *Kvernadze* chiudono a *7*. Pesano però il *4* di *Mina*, il *4.5* di *Ekkelenkamp* e il *9.5* di *Thorstvedt* rimasto in panchina. Il Raimon junior High risponde con *Calò* a *11.5*, *Douvikas* a *10* e *Barella* a *7.5*, ma il capitano *Esposito* si ferma a *5* e in panchina resta *Stankovic* con un *12*, mentre *Martinez Jo.* fa *5*. _Secondo pareggio di fila per entrambe: a metà classifica si sta scomodi._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · QUATTORDICI PUNTI IN PANCHINA E LA VETTA DIVISA*\nIl CriPro Team è primo, ma questa settimana la vetta l'ha divisa da solo. In panchina sono rimasti *Falcone* a *7*, *Bonny* a *10* e *Adams A.* a *10*: messi al posto di *Caprile*, *Maldini* e *Ramos G.* valevano *14* punti in più, il conto più alto della giornata. Bastava il solo portiere: con *Falcone* tra i pali il CriPro Team arrivava a *83*, cinque gol, e vinceva. Anche lo Sfigometro gli dà ragione a metà: è primo con *7* punti ma ne meriterebbe *8*. _La classifica premia chi sceglie bene il venerdì, non chi ha la rosa più lunga._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DI GIORNATA* · *Raimondo* _(17.5, tripletta, 45 crediti)_\n🥈 *MENZIONE* · *Varela* _(15.5 da capitano)_\n😴 *FLOP DI GIORNATA* · *Caprile* _(1.5, con Falcone a 7 in panchina)_\n🪑 *LA PANCHINA D'ORO* · *Stankovic* _(12, mai entrato)_\n⚔️ *LA SFIDA DA SEGUIRE* · _CriPro Team e New Team a 7 punti, separati da 2.5 fantapunti_\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · DI NUOVO DI VENERDÌ*\nLa *4ª giornata* di lega coincide con l'*8ª di Serie A* e si apre ancora di venerdì: *Torino - Monza* il *23 ottobre* alle *20:45*, quindi formazioni da schierare prima. Sabato *Napoli - Roma* alle *18:00* e *Lazio - Parma* alle *20:45*, domenica *Inter - Fiorentina* alle *12:30*, *Lecce - Juventus* alle *18:00* e chiusura con *Udinese - Milan* alle *20:45*. Niente posticipo del lunedì. _Chi guarda la panchina prima di venerdì sera, la domenica non la rimpiange._"}, {"num": 6, "tipo": "post", "data": "26 ottobre 2026", "titolo": "RONALDINHO GAUCHO fa 99.5 e ne segna nove", "sommario": "Riepilogo della 4ª giornata: il 9 - 2 di RONALDINHO GAUCHO, il nuovo record a 99.5 e il CriPro Team da solo in testa a 10.", "punti": ["RONALDINHO GAUCHO 9 - 2, nuovo record 99.5", "CriPro Team solo in testa a 10 punti", "TUTTO PRECISO batte New Team senza Paz N.", "Raimon - FROST PALACE 4 - 4"], "cover": "img/n6_cover_bd9cd324.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 6 · 4ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *NOVE GOL E UN NUOVO RECORD · IL CRIPRO TEAM SCAPPA*\n\n🥇 *CriPro Team* · *10 pt* _(3 - 1 - 0 | 318.5)_\n🥈 *New Team* · *7 pt* _(2 - 1 - 1 | 311)_\n🥉 *Fonzie Team* · *6 pt* _(2 - 0 - 2 | 292.5)_\n4. *TUTTO PRECISO* · *5 pt* _(1 - 2 - 1 | 290)_\n5. *RONALDINHO GAUCHO* · *4 pt* _(1 - 1 - 2 | 308)_\n6. *ALLEGRI ma non troppo* · *4 pt* _(1 - 1 - 2 | 295)_\n7. *FROST PALACE* · *4 pt* _(1 - 1 - 2 | 285.5)_\n8. *Raimon junior High* · *3 pt* _(0 - 3 - 1 | 295)_\n\nIl record della scorsa settimana è durato sette giorni: *RONALDINHO GAUCHO* fa *99.5*, ne segna *nove* ad *ALLEGRI ma non troppo* e dall'ultimo posto sale al quinto. In testa il *CriPro Team* vince lo scontro diretto con il *Fonzie Team* e allunga: *10 punti*, *+3* sul *New Team*, battuto da *TUTTO PRECISO*. Dal quarto al settimo posto ci sono *quattro* squadre in un punto, e in fondo c'è il *Raimon junior High*, ancora senza vittorie. _A un terzo del girone d'andata, solo la vetta ha un padrone._\n\n━━━━━━━━━━━━━\n\n🔴 *99.5 E NOVE GOL · KRSTOVIC SI RIPRENDE IL CAMPO*\n_ALLEGRI ma non troppo 2 - 9 RONALDINHO GAUCHO (72 - 99.5)_\nDue settimane fa *Krstovic* aveva fatto *15* seduto in panchina. Stavolta gioca e fa *15.5*. Con lui *Schmid* chiude a *14*, *McTominay* a *13.5*, *Soulè* a *10* e il capitano *Simeone* a *8*: *99.5* punti, *nove* gol, il punteggio più alto e il maggior numero di gol della stagione. ALLEGRI ma non troppo fa *72*, che in altre giornate vale una vittoria, con *Jimenez A.* a *10*, ma il capitano *Calhanoglu* si ferma a *6* e la difesa ora conta *16* gol subiti, la peggiore della lega. _Il RONALDINHO GAUCHO era ultimo con un punto: in novanta minuti ha segnato più del doppio dei gol delle tre giornate prima._\n\n━━━━━━━━━━━━━\n\n🔵 *THURAM DA CAPITANO · E IL FONZIE TEAM RESTA A 69.5*\n_CriPro Team 2 - 1 Fonzie Team (72.5 - 69.5)_\nIl CriPro Team gioca senza *Rabiot*, *Moreira*, *Valle* e *Cissè*, quattro titolari senza voto, e vince lo stesso. Dalla panchina entra *Elmas* con un *10*, il capitano *Thuram* fa *10.5* e basta così, anche con *Carnesecchi* a *2* tra i pali. Il Fonzie Team, ancora senza *Lautaro*, si affida al capitano *Diouf* (*7*) e a *Maignan* (*7*), e si ferma a *69.5*: mezzo punto sotto i *70* che valevano il secondo gol e il pareggio. In panchina resta *Gatti* con un *8*. _La settimana scorsa il CriPro Team aveva perso la vetta solitaria per mezzo punto. Stavolta il mezzo punto l'ha perso il Fonzie Team._\n\n━━━━━━━━━━━━━\n\n⚫ *SENZA IL CAPITANO E SENZA SVILAR · TUTTO PRECISO VINCE LA PRIMA*\n_New Team 1 - 3 TUTTO PRECISO (67.5 - 74)_\nLa prima vittoria di TUTTO PRECISO arriva nel giorno più strano: *Paz N.*, capitano, non gioca e la fascia passa a *Hojlund* (*6*), mentre in porta tocca a *Bijlow*, preferito a *Gollini*, che fa *8*. Il resto lo fanno *Politano* con *8* e *Vlasic*, entrato dalla panchina, con *10.5*. Il New Team paga la settimana dopo il record: il capitano *Raimondo* passa da *17.5* a *5*, *Meret* chiude a *3.5* e l'unico acuto è *Zielinski* con *10*. In panchina restano *Taylor K.* e *Varela* con un *10* a testa: *12.5* punti lasciati fuori, il conto più alto del turno. _Dal 92.5 al 67.5 in una settimana: il New Team scopre che anche i record vanno in panchina._\n\n━━━━━━━━━━━━━\n\n🟢 *4 - 4 · IL PAREGGIO PIÙ RICCO DELLA STAGIONE*\n_Raimon junior High 4 - 4 FROST PALACE (81.5 - 78.5)_\nOtto gol e *160* punti in due: mai un pareggio era stato così ricco. Il Raimon junior High fa *81.5* con *Douvikas* a *13.5*, *Calò* a *10.5* e *De Ketelaere* a *8*, senza *Martinez Jo.*, sostituito da *Stankovic* (*5*). In panchina restano *McKennie* con un *10* ed *Ederson* con un *8*. Il FROST PALACE risponde con il capitano *Pulisic* a *10*, *Vicario* a *7* e *Belghali*, entrato dalla panchina, a *10*. *Malen* resta seduto con un *6.5*, mentre al suo posto entra *Tourè* (*5.5*). _Terzo pareggio di fila per il Raimon junior High: ultimo in classifica, ma mai sconfitto dopo la prima giornata._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · L'ULTIMO CHE NON MERITA DI ESSERE ULTIMO*\nIl Raimon junior High è ultimo con *3* punti, eppure ha fatto *295* punti totali, quanto ALLEGRI ma non troppo e più del Fonzie Team, di TUTTO PRECISO e del FROST PALACE. Lo Sfigometro lo segna come il più sfortunato della lega, a *-2.1*: con un calendario neutro sarebbe sesto. Dall'altra parte il Fonzie Team è terzo con il sesto totale della lega, ed è il più fortunato, a *+1.1*: in una classifica giusta sarebbe settimo. _Il calendario non segna gol, ma decide chi li paga._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DI GIORNATA* · *Krstovic* _(15.5, due settimane dopo il 15 in panchina)_\n🥈 *MENZIONE* · *Schmid* _(14)_ e *Douvikas* _(13.5)_\n😴 *FLOP DI GIORNATA* · *Carnesecchi* _(2, dopo l'1.5 di Caprile: due settimane nere tra i pali del CriPro Team)_\n🪑 *LA PANCHINA D'ORO* · *Varela* _(10, una settimana dopo il 15.5 da capitano)_\n⚔️ *LA SFIDA DA SEGUIRE* · _quattro squadre tra il quarto e il settimo posto in un punto_\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · SI GIOCA GIÀ DOMANI*\nTurno infrasettimanale: la *5ª giornata* di lega coincide con la *9ª di Serie A* e comincia *martedì 27* con *Sassuolo - Lazio* alle *18:30*. Formazioni da schierare entro domani pomeriggio. Martedì sera *Roma - Cagliari* e *Torino - Como* alle *20:45*; mercoledì *Venezia - Inter*, *Milan - Bologna* e *Parma - Udinese* alle *18:30*, *Monza - Napoli* e *Genoa - Juventus* alle *20:45*; chiusura giovedì con *Frosinone - Lecce* alle *18:30* e *Fiorentina - Atalanta* alle *20:45*. _Due giorni per leggere la Gazzetta, uno per schierare la formazione._"}, {"num": 7, "tipo": "post", "data": "30 ottobre 2026", "titolo": "New Team batte la capolista e la scavalca", "sommario": "Riepilogo della 5ª giornata: New Team vince lo scontro al vertice con il CriPro Team, ALLEGRI ne fa sei al Fonzie Team e TUTTO PRECISO sale terzo.", "punti": ["New Team 5 - 2 al CriPro Team, primo a pari punti", "ALLEGRI 6 - 1 al Fonzie Team con Noslin 14", "TUTTO PRECISO 5 - 4 al FROST PALACE", "RONALDINHO GAUCHO 3 - 2, Raimon ancora a secco"], "cover": "img/n7_cover_795cb1ab.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 7 · 5ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *LO SCONTRO AL VERTICE LO VINCE IL NEW TEAM*\n\n🥇 *New Team* · *10 pt* _(3 - 1 - 1 | 395.5)_\n🥈 *CriPro Team* · *10 pt* _(3 - 1 - 1 | 390.5)_\n🥉 *TUTTO PRECISO* · *8 pt* _(2 - 2 - 1 | 372)_\n4. *RONALDINHO GAUCHO* · *7 pt* _(2 - 1 - 2 | 383.5)_\n5. *ALLEGRI ma non troppo* · *7 pt* _(2 - 1 - 2 | 382.5)_\n6. *Fonzie Team* · *6 pt* _(2 - 0 - 3 | 359)_\n7. *FROST PALACE* · *4 pt* _(1 - 1 - 3 | 365)_\n8. *Raimon junior High* · *3 pt* _(0 - 3 - 2 | 367.5)_\n\nIl turno infrasettimanale cambia la vetta: il *New Team* batte *5 - 2* il *CriPro Team* nello scontro diretto, lo aggancia a *10 punti* e lo supera per il totale, *395.5* contro *390.5*. Dietro sale *TUTTO PRECISO*, terzo a *8* dopo il *5 - 4* al *FROST PALACE*. *ALLEGRI ma non troppo* ne fa sei al *Fonzie Team*, che perde la terza di fila e scivola sesto, e il *RONALDINHO GAUCHO* lascia il *Raimon junior High* ultimo e ancora senza vittorie. _Cinque giornate, due capoliste e un buco nero in fondo alla classifica._\n\n━━━━━━━━━━━━━\n\n🔴 *IL NEW TEAM VINCE LO SCONTRO DIRETTO · E VA IN TESTA*\n_CriPro Team 2 - 5 New Team (72 - 84.5)_\nLa partita della giornata non ha storia. Il New Team ha quattro uomini da almeno *9.5*: il capitano *Raimondo*, *De Bruyne* e *Varela* a *10*, *Zaccagni* a *9.5*, con *Zortea* a *7.5* in difesa. In panchina resta perfino *Taylor K.* con un *11*. Il CriPro Team ha i due voti più alti del campo, *Cissè* a *13.5* e *Isaksen* a *12*, ma il resto non regge: *Bartesaghi* *3*, *Carnesecchi* *4*, il capitano *Ramos G.* *5*, e *Maldini* con un *10* rimasto in panchina. _Quattro giornate in testa, e alla prima sconfitta il CriPro Team si ritrova secondo._\n\n━━━━━━━━━━━━━\n\n🔵 *SEI GOL AL FONZIE TEAM · NOSLIN FA 14*\n_Fonzie Team 1 - 6 ALLEGRI ma non troppo (66.5 - 87.5)_\nALLEGRI ma non troppo fa *87.5* e potrebbe averne lasciati altrettanti fuori: in panchina restano *Lulli* e *Baldanzi* a *11.5* e *Okoye* a *10.5*. In campo bastano *Noslin* a *14*, *Njie* a *11.5* e *Floriani Mussolini* a *10*, con *Jimenez A.* e *Molina* a *7.5*. Il Fonzie Team salva solo il capitano *Mora*, *10.5*: per il resto *Maignan* chiude a *2*, *Cambiaso* a *4*, *Scamacca* e *Spence* non giocano e *Lang* resta seduto con un *8*. Terza sconfitta di fila e *15* gol subiti nelle ultime tre giornate. _Tre giornate fa il Fonzie Team era secondo a punteggio pieno: adesso guarda il fondo della classifica._\n\n━━━━━━━━━━━━━\n\n⚫ *82 TONDI TONDI · TUTTO PRECISO VINCE IL DUELLO DEI GOL*\n_FROST PALACE 4 - 5 TUTTO PRECISO (79.5 - 82)_\nNove gol in due e una soglia presa al centesimo: TUTTO PRECISO fa esattamente *82*, il minimo per il quinto gol, e vince. Il capitano *Paz N.* fa *11.5*, *Politano* *11*, *Hojlund* e *Kvernadze* *10*. Il FROST PALACE ritrova finalmente *Malen*: *10* con la fascia, la sua prima partita da *10* della stagione, insieme a *Esposito Se.* (*10*) e *Ramon* (*9.5*). Non basta per il *4* di *Vicario* e per un *79.5* che resta lontano dagli *82*. In panchina restano *Adams C.* con un *10* e *Miranda J.* con un *8*. _Il nome della squadra non mente: TUTTO PRECISO, al mezzo punto._\n\n━━━━━━━━━━━━━\n\n🟢 *BATURINA SI SVEGLIA · IL RAIMON RESTA A SECCO*\n_RONALDINHO GAUCHO 3 - 2 Raimon junior High (75.5 - 72.5)_\n*Baturina*, pagato *220* crediti, fa *10* per la prima volta in stagione, *Provedel* para tutto con un *8* e *Schmid* aggiunge un altro *8*. Il capitano *Soulè* si ferma a *6* e in panchina resta *Monteiro J.* con un *9.5*, ma basta lo stesso. Il Raimon junior High ha *De Ketelaere* a *11.5* e *Calò* a *10.5*, al quarto voto da almeno *10* in cinque giornate, ma *Frattesi* chiude a *3*, il capitano *Douvikas* a *5.5* e *Martinez Jo.* non gioca. *72.5* punti: ne servivano *74* per il terzo gol e il pari. _Cinque giornate, zero vittorie: il Raimon junior High aspetta ancora la prima._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · LA PORTA DEL CRIPRO TEAM*\nIn cinque giornate i portieri titolari del CriPro Team hanno preso *4.5*, *5*, *1.5*, *2* e *4*: una media di *3.4*, la più bassa della lega. Questa settimana non c'era nemmeno l'alternativa: in panchina *Falcone* ha fatto *2* e *Caprile* *2.5*. Tre portieri e nessuno sopra il *4*: è il reparto che costa la vetta a una squadra che davanti ha *Isaksen*, *Cissè* e *Thuram*. _Il CriPro Team ha il secondo attacco della lega, ma gioca ogni domenica con un gol di svantaggio._\n\n━━━━━━━━━━━━━\n\n🏆 *MVP DI GIORNATA* · *Noslin* _(14, ALLEGRI ma non troppo)_\n🥈 *MENZIONE* · *Cissè* _(13.5, pagato 25 crediti)_\n😴 *FLOP DI GIORNATA* · *Maignan* _(2, sei gol subiti)_\n🪑 *LA PANCHINA D'ORO* · *Lulli* e *Baldanzi* _(11.5 a testa, mai entrati)_\n⚔️ *LA SFIDA DA SEGUIRE* · _New Team e CriPro Team a 10 punti, TUTTO PRECISO a -2_\n\n━━━━━━━━━━━━━\n\n📅 *E ADESSO · IL DERBY DI MILANO*\nLa *6ª giornata* di lega coincide con la *10ª di Serie A* e si apre *sabato 31 ottobre* con *Bologna - Monza* alle *15:00*: formazioni da schierare prima. Alle *18:00* *Udinese - Roma*, alle *20:45* il derby *Milan - Inter*, che mezza lega guarderà con la calcolatrice in mano. Domenica *Como - Venezia* alle *12:30*, *Frosinone - Torino* e *Lazio - Cagliari* alle *15:00*, *Lecce - Genoa* alle *18:00* e *Juventus - Napoli* alle *20:45*; chiusura lunedì con *Sassuolo - Fiorentina* alle *18:30* e *Atalanta - Parma* alle *20:45*. _Tra un turno infrasettimanale e un derby, chi sbaglia formazione non ha più scuse._"}, {"num": 8, "tipo": "post", "data": "3 novembre 2026", "titolo": "Il FROST PALACE ne fa sette alla capolista", "sommario": "Riepilogo della 6ª giornata: il 7 - 3 del FROST PALACE sul New Team, il CriPro Team di nuovo solo in testa e la terza vittoria di fila del RONALDINHO GAUCHO.", "punti": ["FROST PALACE 7 - 3 al New Team con 92", "CriPro Team solo in testa a 11", "RONALDINHO GAUCHO, tre vittorie di fila", "TUTTO PRECISO 63, minimo stagionale"], "cover": "img/n8_cover_70c47491.jpg", "testo": "📰 *LA GAZZETTA DELLA FC IN FAMIGLIA*\n_Numero 8 · 6ª Giornata · Stagione 2026 / 2027_\n\n━━━━━━━━━━━━━\n\n📊 *IL CRIPRO TEAM TORNA SOLO · TRE SQUADRE IN UN PUNTO*\n\n🥇 *CriPro Team* · *11 pt* _(3 - 2 - 1 | 465.5)_\n🥈 *New Team* · *10 pt* _(3 - 1 - 2 | 469.5)_\n🥉 *RONALDINHO GAUCHO* · *10 pt* _(3 - 1 - 2 | 459.5)_\n4. *ALLEGRI ma non troppo* · *8 pt* _(2 - 2 - 2 | 457.5)_\n5. *TUTTO PRECISO* · *8 pt* _(2 - 2 - 2 | 435)_\n6. *FROST PALACE* · *7 pt* _(2 - 1 - 3 | 457)_\n7. *Fonzie Team* · *7 pt* _(2 - 1 - 3 | 435)_\n8. *Raimon junior High* · *4 pt* _(0 - 4 - 2 | 443.5)_\n\nLa capolista di una settimana dura sette giorni: il *New Team* ne prende sette dal *FROST PALACE* e il *CriPro Team*, fermato sul *3 - 3* da *ALLEGRI ma non troppo*, torna primo da solo con *11 punti*. Dietro, a *10*, il New Team e il *RONALDINHO GAUCHO*, che batte *TUTTO PRECISO* e vince la terza partita di fila. Il *Raimon junior High* pareggia ancora, la quarta volta in sei giornate, e resta l'unica squadra senza vittorie. _Tre squadre in un punto: la vetta non ha più un padrone, ha tre inquilini._\n\n━━━━━━━━━━━━━\n\n🔴 *SETTE GOL AL NEW TEAM · IL FROST PALACE FA 92*\n_FROST PALACE 7 - 3 New Team (92 - 74)_\nIl FROST PALACE gioca la partita migliore della sua stagione proprio contro la capolista. *Laurientè*, pagato *16* crediti, fa doppietta e *14*; *Pulisic*, *Alajbegovic* e il capitano *Malen* chiudono a *10*, *Miranda J.* a *8* e *Vicario* para con un *7.5*. *92* punti, il terzo punteggio più alto della stagione, e sette gol. L'unica macchia è *Zappacosta*, *2.5*, mentre in panchina resta *Da Cunha* con un *10*. Il New Team si salva solo con *Varela* (*10*): il capitano *Raimondo* si ferma a *6*, *Meret* a *4.5* e *Pellegrino M.* fa *10* seduto in panchina. _Una settimana fa il New Team aveva battuto la capolista. Stavolta la capolista era lui._\n\n━━━━━━━━━━━━━\n\n🔵 *76 A 76 · IL QUARTO PAREGGIO DEL RAIMON*\n_Raimon junior High 3 - 3 Fonzie Team (76 - 76)_\nStesso punteggio al mezzo punto, come era successo al Raimon tre giornate fa con TUTTO PRECISO. Il Raimon junior High ha *Calò* a *10.5*, al quinto voto da almeno *10* in sei giornate, e *Bastoni* a *9.5*, ma il capitano *Douvikas* chiude a *6.5* ed *Esposito F.P.* non prende voto; in panchina restano *N'Dicka* con un *9.5* e *Modric* con un *7*. Il Fonzie Team interrompe la serie di tre sconfitte con il capitano *Osmajic* e *Mora* a *10* e *Butez* a *7* in porta, al posto di *Maignan*; seduto in panchina c'è *Zaniolo* con un *9*. _Sei giornate, quattro pareggi e nessuna vittoria: il Raimon junior High è la squadra del quasi._\n\n━━━━━━━━━━━━━\n\n⚫ *TRE DI FILA · IL RONALDINHO GAUCHO NON SI FERMA PIÙ*\n_TUTTO PRECISO 0 - 3 RONALDINHO GAUCHO (63 - 76)_\nUltimo con un punto dopo tre giornate, adesso terzo a pari punti con il New Team: il RONALDINHO GAUCHO vince la terza partita consecutiva. Questa volta senza fuochi d'artificio: *Soulè* fa *9.5*, *Skorupski* *9*, *Wesley* *7.5*, *Akanji* e *Pavlovic* *7*, mentre il capitano *Krstovic* si ferma a *5*. Basta, perché TUTTO PRECISO fa *63*, il punteggio più basso della stagione e zero gol: senza *Hojlund* e *Mancini*, il migliore è *Kvernadze* con *8*, e in panchina restano *Cristante* a *11.5* e *Boga* a *10*. _Nell'ultimo turno TUTTO PRECISO vinceva con 82 punti esatti. Stavolta gliene mancavano tre per il primo gol._\n\n━━━━━━━━━━━━━\n\n🟢 *MOREIRA FA 12.5 · MA IL CRIPRO TEAM SI FERMA A 75*\n_ALLEGRI ma non troppo 3 - 3 CriPro Team (75 - 75)_\nIl secondo pareggio a punteggio identico della giornata. Il CriPro Team ha *Moreira* a *12.5*, *Isaksen* a *10.5* e *Rabiot* a *10*, ma gioca senza *Valle* e *Dimarco*, il capitano *Thuram* si ferma a *5* e in porta *Carnesecchi* chiude a *2.5*. ALLEGRI ma non troppo risponde con *Njie* a *11*, *Mastantuono* a *10* e *Ndour* a *8*, e lascia in panchina *Pinamonti* con un *9.5*. Seduto c'era anche *Okoye*, che in Serie A ha preso cinque gol: fantavoto *0*. Per una volta, un portiere in panchina è stata una fortuna. _Il CriPro Team non vince, ma torna primo lo stesso: a volte basta che perdano gli altri._\n\n━━━━━━━━━━━━━\n\n📉 *IL CASO · MALEN SI È SVEGLIATO*\nNelle prime quattro giornate il giocatore più caro const fmtTesto = s => esc(s)
  .replace(/(^|[\s(\[>])\*([^*\n]+?)\*(?=$|[\s.,;:!?)\]])/g, '$1<b>$2</b>')

/* ---------- articolo illustrato ---------- */
const SQNOME = {};
Object.keys(LEGA.squadre).forEach(k => { SQNOME[LEGA.squadre[k].nome.toLowerCase()] = k; });
const trovaSq = n => SQNOME[String(n).trim().toLowerCase()] || null;

const RIGA_SEP  = /^[━─—-]{5,}$/;
const RIGA_TIT  = /^(\S+)\s+\*([^*]+)\*$/u;
const RIGA_TIT2 = /^(\S+)\s+\*([^*]+)\*\s*·\s*\*([^*]+)\*$/u;
const RIGA_CLS  = /^(🥇|🥈|🥉|\d+\.)\s+\*(.+?)\*\s+·\s+\*(.+?)\*\s+_\((.+?)\)_$/u;
const RIGA_VS   = /^_?(.{2,40}?)\s+vs\s+(.{2,40}?)_?$/i;
const RIGA_MATCH= /^_(.+?)\s+(\d+)\s+-\s+(\d+)\s+(.+?)\s+\(([\d.,]+)\s+-\s+([\d.,]+)\)_$/;

function stemma(k, cls){
  const s = LEGA.squadre[k];
  return s && s.logo ? `<img src="${s.logo}" alt="">` : `<span class="${cls||''}"></span>`;
}

function articolo(testo){
  const righe = String(testo).split("\n");
  let out = "", buf = [], cls = [], capo = false;

  const chiudiP = () => {
    if (!buf.length) return;
    const testo = buf.join(" ").replace(/<[^>]+>/g, "");
    const lungo = testo.length > 90;
    const k = (!capo && lungo) ? ' class="attacco"' : '';
    if (k) capo = true;
    out += `<p${k}>` + buf.join("<br>") + "</p>";
    buf = [];
  };
  const chiudiCls = () => {
    if (!cls.length) return;
    out += '<ul class="cls">' + cls.join("") + "</ul>";
    cls = [];
  };

  let n = 0;
  for (const r0 of righe){
    const r = r0.trim();
    n++;
    if (n <= 3 && (/LA GAZZETTA DELLA/i.test(r) || /^_Numero .*_$/i.test(r))) continue;

    if (!r){ chiudiCls(); chiudiP(); continue; }

    if (RIGA_SEP.test(r)){ chiudiCls(); chiudiP(); out += "<hr>"; continue; }

    let m = r.match(RIGA_CLS);
    if (m && trovaSq(m[2])){
      chiudiP();
      const k = trovaSq(m[2]);
      cls.push(`<li class="${cls.length?'':'top'}">
        <span class="p">${esc(m[1].replace('.',''))}</span>
        ${k ? stemma(k) : '<span></span>'}
        <span class="n">${esc(m[2])}</span>
        <span class="pt">${esc(m[3])}</span>
        <span class="tot">${esc(m[4].split("|").pop().trim())}</span></li>`);
      continue;
    }
    chiudiCls();

    m = r.match(RIGA_MATCH);
    if (m){
      chiudiP();
      const a = trovaSq(m[1]), b = trovaSq(m[4]);
      out += `<div class="scheda">
        <div class="lato">${a?stemma(a):''}<span class="nm">${esc(m[1])}</span></div>
        <div class="mid"><div class="gol">${esc(m[2])} - ${esc(m[3])}</div>
          <div class="fp">${esc(m[5])} · ${esc(m[6])}</div></div>
        <div class="lato">${b?stemma(b):''}<span class="nm">${esc(m[4])}</span></div>
      </div>`;
      continue;
    }

    m = r.match(RIGA_VS);
    if (m && trovaSq(m[1]) && trovaSq(m[2])){
      chiudiP();
      const a = trovaSq(m[1]), b = trovaSq(m[2]);
      out += `<div class="scheda">
        <div class="lato">${stemma(a)}<span class="nm">${esc(m[1])}</span></div>
        <div class="mid"><div class="vs">vs</div></div>
        <div class="lato">${stemma(b)}<span class="nm">${esc(m[2])}</span></div>
      </div>`;
      continue;
    }

    m = r.match(RIGA_TIT2);
    if (m && !/[a-zàèéìòù]/.test(m[1])){
      chiudiP();
      out += `<h3><span class="em">${esc(m[1])}</span><span>${esc(m[2])}
        <span class="sub">${esc(m[3])}</span></span></h3>`;
      continue;
    }

    m = r.match(RIGA_TIT);
    if (m && !/[a-zàèéìòù]/.test(m[1])){
      chiudiP();
      out += `<h3><span class="em">${esc(m[1])}</span><span>${esc(m[2])}</span></h3>`;
      continue;
    }

    buf.push(fmtTesto(r));
  }
  chiudiCls(); chiudiP();
  return out;
}

const SQ = LEGA.squadre;

/* ---------- calcoli ---------- */
function classifica(){
  const t = {};
  Object.keys(SQ).forEach(k => t[k] = {k, g:0, v:0, n:0, p:0, gf:0, gs:0, pt:0, tot:0});
  LEGA.giornate.forEach(gio => gio.partite.forEach(p => {
    const a = t[p.c], b = t[p.t];
    a.g++; b.g++;
    a.gf += p.gc; a.gs += p.gt; b.gf += p.gt; b.gs += p.gc;
    a.tot += p.pc; b.tot += p.pt;
    if (p.gc > p.gt){ a.v++; b.p++; a.pt += 3; }
    else if (p.gc < p.gt){ b.v++; a.p++; b.pt += 3; }
    else { a.n++; b.n++; a.pt++; b.pt++; }
  }));
  return Object.values(t).sort((x,y) =>
    y.pt - x.pt || y.tot - x.tot || (y.gf - y.gs) - (x.gf - x.gs));
}
const SOGLIA = 66, PASSO = 4;
function golDa(p){ return p < SOGLIA ? 0 : 1 + Math.floor((p - SOGLIA) / PASSO); }
function mancava(p){ const s = p < SOGLIA ? SOGLIA : SOGLIA + PASSO * (Math.floor((p - SOGLIA) / PASSO) + 1); return +(s - p).toFixed(1); }
function prestazioni(){
  const r = [];
  LEGA.giornate.forEach(g => g.partite.forEach(p => {
    r.push({sq:p.c, punti:p.pc, n:g.n});
    r.push({sq:p.t, punti:p.pt, n:g.n});
  }));
  return r;
}

function mvpGiornata(g){
  const t = (g.titolari || []).filter(x => typeof x[2] === "number");
  if (!t.length) return [];
  const max = Math.max(...t.map(x => x[2]));
  return t.filter(x => x[2] === max);
}

function sfigometro(){
  if (!LEGA.giornate.length) return "";
  const reale = classifica();
  const posReale = {}; reale.forEach((r,i) => posReale[r.k] = i+1);
  const t = {}; Object.keys(SQ).forEach(k => t[k] = {k, mer:0});
  LEGA.giornate.forEach(g => {
    const pts = {}; g.partite.forEach(p => { pts[p.c] = p.pc; pts[p.t] = p.pt; });
    const ks = Object.keys(pts);
    ks.forEach(k => {
      let w = 0, d = 0; const a = golDa(pts[k]);
      ks.forEach(k2 => { if (k2 === k) return; const b = golDa(pts[k2]); if (a > b) w++; else if (a === b) d++; });
      t[k].mer += (3*w + d) / (ks.length - 1);
    });
  });
  const righe = Object.values(t).map(o => {
    const rr = reale.find(x => x.k === o.k);
    return {k:o.k, pt: rr.pt, mer:+o.mer.toFixed(1), diff:+(rr.pt - o.mer).toFixed(1)};
  }).sort((a,b) => b.mer - a.mer || b.pt - a.pt);
  const posMer = {}; righe.forEach((r,i) => posMer[r.k] = i+1);
  const salto = k => posMer[k] - posReale[k];
  const fort = righe.slice().sort((a,b) => b.diff - a.diff || salto(b.k) - salto(a.k) || b.pt - a.pt)[0];
  const sfig = righe.slice().sort((a,b) => a.diff - b.diff || salto(a.k) - salto(b.k) || b.pt - a.pt)[0];
  const giusto = righe.slice().sort((a,b) => Math.abs(a.diff) - Math.abs(b.diff) || Math.abs(salto(a.k)) - Math.abs(salto(b.k)) || b.pt - a.pt)[0];
  const posti = (k, su) => { const d = su ? salto(k) : -salto(k); return d > 0 ? `, ${d} ${d === 1 ? "posto" : "posti"} in ${su ? "più" : "meno"}` : ""; };
  const segno = v => v > 0 ? `<span class="sfg-pos">+${v}</span>` : v < 0 ? `<span class="sfg-neg">${v}</span>` : `<span class="sfg-zero">0</span>`;
  const mossa = k => { const d = posReale[k] - posMer[k]; return d > 0 ? `<span class="sfg-pos">▲${d}</span>` : d < 0 ? `<span class="sfg-neg">▼${-d}</span>` : `<span class="sfg-zero">=</span>`; };
  const pr = (em, et, o, vl) => `<div class="pr"><div class="em">${em}</div><div class="et">${et}</div>
    <img src="${SQ[o.k].logo}" alt=""><div class="nm">${esc(SQ[o.k].breve)}</div><div class="vl">${vl}</div></div>`;
  return `<div class="sfg-testa" id="sfigometro-box"><h2>Lo Sfigometro</h2>
    <div class="sotto">Se fosse andata come doveva andare</div>
    ${quadranteSfiga(sfig, fort)}
    <div class="ago">La lancetta segna il più sfortunato: <b>${esc(SQ[sfig.k].breve)}</b> a ${sfig.diff}</div></div>
    <div class="card" style="margin-bottom:12px"><p style="margin:0;color:var(--tenue);font-size:16px">
      E se il calendario non c'entrasse? Qui ogni squadra gioca contro tutte le altre, ogni giornata, con i gol delle soglie di sempre.
      Non è la classifica vera: è quella che dice quanto hai meritato. La differenza tra i punti veri e quelli meritati è lo sfigometro:
      sotto zero sei sfortunato, sopra zero ringrazia il calendario.</p></div>
    <div class="sfg-premi">
      ${pr("🍀", "Il più fortunato", fort, (fort.diff > 0 ? "+" : "") + fort.diff + " punti regalati" + posti(fort.k, true))}
      ${pr("🌧️", "Il più sfortunato", sfig, sfig.diff + " punti rubati" + posti(sfig.k, false))}
      ${pr("⚖️", "Il più giusto", giusto, (giusto.diff > 0 ? "+" : "") + giusto.diff + ", fortuna quasi a zero")}
    </div>
    <div class="card" style="margin-bottom:12px">${graficoSfiga(righe)}</div>
    <h3 style="font-size:17px;margin:6px 2px 8px">Dal più fortunato al più sfortunato</h3>
    <table><thead><tr><th></th><th>Squadra</th><th class="r">Veri</th><th class="r">Meritati</th><th class="r">Sfigometro</th></tr></thead>
    <tbody>${righe.slice().sort((a,b) => b.diff - a.diff || b.mer - a.mer).map((o,i) => `<tr><td class="n">${i+1}</td>
      <td><img class="mini" src="${SQ[o.k].logo}">\xA0${esc(SQ[o.k].breve)} <span style="font-size:13px">${mossa(o.k)}</span></td>
      <td class="r">${o.pt}</td><td class="r"><b>${o.mer}</b></td><td class="r">${segno(o.diff)}</td></tr>`).join("")}</tbody></table>
    <p class="sfg-nota">La freccia accanto al nome dice di quante posizioni la squadra salirebbe o scenderebbe nella classifica meritata.</p>
    <p class="sfg-nota">Stime a scopo ricreativo: la classifica ufficiale resta quella dell'app, e le lamentele vanno al calendario.</p>`;
}

function quadranteSfiga(sfig, fort){
  const max = Math.max(1, Math.abs(sfig.diff), Math.abs(fort.diff));
  const W = 300, H = 186, cx = 150, cy = 150, R = 124, r = 84;
  const arc = (a0, a1, col) => {
    const p = a => [cx + R * Math.cos(a), cy - R * Math.sin(a)], q = a => [cx + r * Math.cos(a), cy - r * Math.sin(a)];
    const [x0,y0] = p(a0), [x1,y1] = p(a1), [x2,y2] = q(a1), [x3,y3] = q(a0);
    return `<path d="M${x0},${y0} A${R},${R} 0 0 0 ${x1},${y1} L${x2},${y2} A${r},${r} 0 0 1 ${x3},${y3} Z" fill="${col}"/>`;
  };
  const seg = [["#C8003F",Math.PI,Math.PI*0.8],["#E8475F",Math.PI*0.8,Math.PI*0.6],["#F4B400",Math.PI*0.6,Math.PI*0.4],["#7FBF4D",Math.PI*0.4,Math.PI*0.2],["#1B7F3B",Math.PI*0.2,0]];
  const ang = Math.PI/2 + (sfig.diff / max) * (Math.PI/2) * -1;
  const nx = cx + (R - 16) * Math.cos(ang), ny = cy - (R - 16) * Math.sin(ang);
  return `<svg viewBox="0 0 ${W} ${H}" font-family="'Barlow Condensed',Arial,sans-serif" role="img" aria-label="Quadrante dello sfigometro">
    ${seg.map(([c,a0,a1]) => arc(a0, a1, c)).join("")}
    <text x="${cx-R+(R-r)/2}" y="${cy+22}" font-size="12" fill="#ddd" font-weight="700" text-anchor="middle">SFIGA</text>
    <text x="${cx+R-(R-r)/2}" y="${cy+22}" font-size="12" fill="#ddd" font-weight="700" text-anchor="middle">FORTUNA</text>
    <text x="${cx}" y="22" font-size="11" fill="#bbb" text-anchor="middle">0</text>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="11" fill="#fff"/><circle cx="${cx}" cy="${cy}" r="5" fill="#2B2B30"/>
    <image href="${SQ[sfig.k].logo}" x="${cx-22}" y="${cy-58}" width="44" height="44" clip-path="circle(22px at 22px 22px)"/>
  </svg>`;
}

function graficoSfiga(righe){
  const d = righe.slice().sort((a,b) => b.diff - a.diff);
  const max = Math.max(1, ...d.map(o => Math.abs(o.diff)));
  const W = 360, LAB = 118, rowH = 30, H = d.length * rowH + 30, x0 = LAB + 6, x1 = W - 6;
  const mid = x0 + (x1 - x0) * 0.45, half = Math.min(mid - x0, x1 - mid) - 30;
  const X = v => mid + (v / max) * half;
  let out = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;font-family:'Barlow Condensed',Arial,sans-serif" role="img" aria-label="Fortuna e sfortuna per squadra">`;
  out += `<text x="${x0}" y="14" font-size="12" fill="var(--tenue)" text-anchor="start">SFORTUNA</text>`;
  out += `<text x="${x1}" y="14" font-size="12" fill="var(--tenue)" text-anchor="end">FORTUNA</text>`;
  out += `<line x1="${mid}" y1="22" x2="${mid}" y2="${H-4}" stroke="var(--testo)" stroke-width="1.5"/>`;
  d.forEach((o,i) => {
    const y = 26 + i * rowH, w = Math.abs(X(o.diff) - mid), xb = o.diff >= 0 ? mid : mid - w;
    const col = o.diff > 0 ? "#1B7F3B" : o.diff < 0 ? "var(--magenta)" : "var(--tenue)";
    out += `<text x="${LAB}" y="${y+16}" text-anchor="end" font-size="13" font-weight="600" fill="var(--testo)">${esc(SQ[o.k].breve)}</text>`;
    out += `<rect x="${xb}" y="${y+4}" width="${Math.max(2,w)}" height="18" rx="4" fill="${col}"/>`;
    const tx = o.diff >= 0 ? X(o.diff) + 5 : X(o.diff) - 5;
    out += `<text x="${tx}" y="${y+17}" font-size="13" font-weight="700" fill="${col}" text-anchor="${o.diff >= 0 ? "start" : "end"}">${o.diff > 0 ? "+" : ""}${o.diff}</text>`;
  });
  return out + `</svg>`;
}

function recordRiga(pr, v){
  const chi = pr.filter(x => x.punti === v).sort((a,b) => a.n - b.n);
  if (chi.length === 1) return `${esc(SQ[chi[0].sq].breve)} \xb7 <b>${v} punti</b> \xb7 ${chi[0].n}\xaa giornata`;
  const sq = [...new Set(chi.map(x => x.sq))];
  if (sq.length === 1) return `${esc(SQ[sq[0]].breve)} \xb7 <b>${v} punti</b> \xb7 ` + chi.map(x => `${x.n}\xaa`).join(" e ") + ` giornata`;
  return chi.map(x => `${esc(SQ[x.sq].breve)} (${x.n}\xaa giornata)`).join(" e ") + ` \xb7 <b>${v} punti</b>, a pari merito`;
}

function termometro(){
  const ultima = LEGA.giornate[LEGA.giornate.length - 1];
  const dati = [];
  ultima.partite.forEach(p => { dati.push({sq:p.c, punti:p.pc}); dati.push({sq:p.t, punti:p.pt}); });
  dati.sort((a,b) => b.punti - a.punti);
  const min = 55, max = Math.max(...dati.map(d => d.punti)) + 4;
  const W = 340, H = dati.length * 30 + 34, LAB = 116, x0 = LAB, x1 = W - 26;
  const X = v => x0 + (v - min) / (max - min) * (x1 - x0);
  let soglie = "";
  for (let v = SOGLIA, n = 1; v <= max; v += PASSO, n++){
    soglie += `<line x1="${X(v).toFixed(1)}" y1="26" x2="${X(v).toFixed(1)}" y2="${H-8}"
      stroke="var(--bordo)" stroke-dasharray="3 4"/>
      <text x="${X(v).toFixed(1)}" y="20" text-anchor="middle" font-size="11" fill="var(--tenue)">${n}</text>`;
  }
  const barre = dati.map((d,i) => {
    const y = 30 + i * 30, w = Math.max(3, X(d.punti) - x0);
    const vicino = mancava(d.punti) <= 1.5;
    return `<text x="${x0-8}" y="${y+13}" text-anchor="end" font-size="13" font-weight="600"
      fill="var(--testo)">${esc(SQ[d.sq].breve)}</text>
      <rect x="${x0}" y="${y}" width="${w.toFixed(1)}" height="19" rx="2"
      fill="${vicino ? "var(--magenta)" : "var(--blu)"}"/>
      <text x="${(x0+w+6).toFixed(1)}" y="${y+14}" font-size="12" font-weight="700" fill="var(--testo)">${d.punti}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Termometro delle soglie gol"
    style="display:block">${soglie}${barre}</svg>`;
}

    <p class="credito">Sito realizzato e curato da <a href="https://prosperialfonso.com" rel="author">Alfonso Prosperi</a></p>`;
}

/* ---------- navigazione ---------- */
const SEZIONI = [["prima","Prima pagina"],["archivio","Archivio"],["giornate","Giornate"],["classifica","Classifiche"],
                 ["statistiche","Statistiche"],["squadre","Squadre"],["mercato","Mercato"]];
let sezioneCorrente = "prima";

function mostra(id, push, ancora){
  document.querySelectorAll("section").forEach(s => s.classList.remove("on"));
  $("sec-" + id).classList.add("on");
  document.querySelectorAll("#nav button").forEach(b =>
    b.setAttribute("aria-current", b.dataset.sez === id ? "true" : "false"));
  if (id !== "numero") sezioneCorrente = id;
  const cf = document.querySelector("footer .credito");
  if (cf) cf.hidden = (id === "numero");
  window.scrollTo(0, 0);
  if (push) history.pushState({sez:id, num:numAperto}, "", ancora || ("#" + id));
}

function init(){
  $("hLega").textContent = LEGA.nome;
  $("hAgg").textContent = "Aggiornato " + (/^(1|8|11)\b/.test(LEGA.aggiornato) ? "all'" : "al ") + LEGA.aggiornato;
  $("hSotto").textContent = "Stagione " + LEGA.stagione + " · archivio delle uscite";
  $("piede").textContent = "Archivio ufficiale della " + LEGA.nome + " · stagione " + LEGA.stagione;
  $("nav").innerHTML = SEZIONI.map(([id,t]) =>
    `<button data-sez="${id}"${id==="prima"?' aria-current="true"':""}>${t}</button>`).join("");
  vistaPrima(); vistaArchivio(); vistaGiornate(); vistaClassifica(); vistaStatistiche(); vistaSquadre(); vistaMercato();

  document.addEventListener("click", e => {
    const nav = e.target.closest("#nav button");
    if (nav){ mostra(nav.dataset.sez, true); return; }
    const apri = e.target.closest("[data-num]");
    if (apri){ const n = parseFloat(apri.dataset.num);
      vistaNumero(n); mostra("numero", true, "#n" + n); return; }
    const rosa = e.target.closest("[data-rosa]");
    if (rosa){ $("rosa-" + rosa.dataset.rosa).classList.toggle("on"); return; }
    if (e.target.id === "indietro"){
      if (history.state && history.state.diretto) mostra("archivio", true);
      else history.back();
      return; }
    if (e.target.id === "tema"){
      const scuro = document.documentElement.getAttribute("data-theme") === "dark";
      document.documentElement.setAttribute("data-theme", scuro ? "light" : "dark");
      e.target.textContent = scuro ? "Tema scuro" : "Tema chiaro";
    }
  });

  window.addEventListener("popstate", ev => {
    const st = ev.state || {};
    if (st.sez === "numero" && st.num != null){ vistaNumero(st.num); mostra("numero", false); return; }
    mostra(st.sez && st.sez !== "numero" ? st.sez : sezioneCorrente, false);
  });

  // indirizzo diretto: #n2 apre il numero 2, #classifica apre la sezione
  function daIndirizzo(primaVolta){
    const anc = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    const mn = anc.match(/^n(\d+(?:[.,]\d+)?)$/i);
    const nRich = mn ? parseFloat(mn[1].replace(",", ".")) : null;
    if (nRich != null && LEGA.uscite.some(u => u.num === nRich)){
      if (nRich === numAperto && !primaVolta) return;
      vistaNumero(nRich);
      history.replaceState({sez:"numero", num:nRich, diretto:primaVolta}, "", "#n" + nRich);
      mostra("numero", false);
      return;
    }
    if (anc === "sfigometro"){
      history.replaceState({sez:"classifica"}, "", "#sfigometro");
      mostra("classifica", false);
      const meta = () => { const el = document.querySelector(".sfg-testa"); return el ? el.getBoundingClientRect().top + window.scrollY - 64 : 0; };
      const scorri = () => {
        const da = window.scrollY, a = meta(), t0 = performance.now(), dur = 1100;
        const passo = t => { const k = Math.min(1, (t - t0) / dur), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;
          window.scrollTo(0, da + (a - da) * e); if (k < 1) requestAnimationFrame(passo); };
        requestAnimationFrame(passo);
      };
      const parti = () => setTimeout(scorri, 350);
      if (document.readyState === "complete") parti(); else window.addEventListener("load", parti, {once:true});
      setTimeout(() => { if (Math.abs(window.scrollY - meta()) > 40) scorri(); }, 2600);
      return;
    }
    if (SEZIONI.some(s => s[0] === anc) && anc !== "numero"){
      history.replaceState({sez:anc}, "", "#" + anc);
      mostra(anc, false);
      return;
    }
    if (primaVolta) history.replaceState({sez:"prima"}, "", "#prima");
  }
  window.addEventListener("hashchange", () => daIndirizzo(false));
  daIndirizzo(true);
  document.documentElement.setAttribute("data-theme", "light");
}
init();
</script>

  <ol id="ia-passi"></ol>
  <p class="ia-nota" id="ia-nota" hidden></p>
  <button id="ia-ok" type="button">Ho capito</button>
</div></div>
<script>
(function(){
  var K_CHIUSO="ia_chiuso_il", K_FATTO="ia_installata", GIORNI=30;
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  var ua=navigator.userAgent||"";
  var standalone=(window.matchMedia&&(matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: minimal-ui)").matches))||navigator.standalone===true;
  if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
  if(standalone) return;
  if(get(K_FATTO)) return;
  var t=parseInt(get(K_CHIUSO)||"0",10);
  if(t && Date.now()-t < GIORNI*864e5) return;

  var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  var iosAltro=ios&&/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|GSA\/|YaBrowser|DuckDuckGo|Instagram|FBAN|FBAV|Line\//.test(ua);
  var androidFirefox=/Android/.test(ua)&&/Firefox\//.test(ua);
  var macSafari=!ios&&/Macintosh/.test(ua)&&/Safari\//.test(ua)&&!/Chrome|Chromium|CriOS|Edg\/|OPR\/|Firefox/.test(ua);

  var GUIDE={
    iosSafari:{p:["Tocca <b>Condividi</b> ⬆︎ nella barra in basso di Safari.","Scorri e tocca <b>“Aggiungi alla schermata Home”</b>.","Tocca <b>“Aggiungi”</b> in alto a destra."]},
    iosAltro:{p:["Tocca <b>Condividi</b> ⬆︎ (vicino all'indirizzo, oppure nel menu ⋯).","Tocca <b>“Aggiungi alla schermata Home”</b>.","Tocca <b>“Aggiungi”</b>."],n:"Se non trovi la voce, apri la pagina con Safari e ripeti."},
    androidFirefox:{p:["Tocca il menu <b>⋮</b> di Firefox.","Tocca <b>“Installa”</b> (o “Aggiungi a schermata Home”).","Conferma con <b>“Aggiungi”</b>."]},
    macSafari:{p:["Nella barra dei menu apri <b>File</b>.","Scegli <b>“Aggiungi al Dock”</b>.","Conferma con <b>“Aggiungi”</b>."]}
  };
  var guida=ios?(iosAltro?"iosAltro":"iosSafari"):androidFirefox?"androidFirefox":macSafari?"macSafari":null;
  var evento=null, disponibile=!!guida;

  var bar=document.getElementById("ia-bar"), velo=document.getElementById("ia-velo");
  function inHome(){var h=document.getElementById("sec-prima");return !!(h&&h.classList.contains("on"))}
  function aggiorna(){
    var lb=document.getElementById("lb"); var lbAperto=lb&&getComputedStyle(lb).display!=="none";
    var vedi=disponibile&&inHome()&&!lbAperto;
    bar.classList.toggle("on",vedi); document.body.classList.toggle("ia-spazio",vedi);
  }
  function spegni(){disponibile=false;velo.classList.remove("on");aggiorna()}
  function apriGuida(){
    var g=GUIDE[guida]; document.getElementById("ia-passi").innerHTML=g.p.map(function(x){return"<li>"+x+"</li>"}).join("");
    var n=document.getElementById("ia-nota"); n.hidden=!g.n; n.textContent=g.n||"";
    velo.classList.add("on");
  }
  document.getElementById("ia-btn").addEventListener("click",function(){
    if(evento){var e=evento;evento=null;e.prompt();
      (e.userChoice||Promise.resolve({})).then(function(r){if(r&&r.outcome==="accepted"){set(K_FATTO,"1");spegni()}});
    } else if(guida){apriGuida()}
  });
  document.getElementById("ia-x").addEventListener("click",function(){set(K_CHIUSO,String(Date.now()));spegni()});
  document.getElementById("ia-ok").addEventListener("click",function(){velo.classList.remove("on")});
  velo.addEventListener("click",function(e){if(e.target===velo)velo.classList.remove("on")});
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();if(ios)return;evento=e;guida=null;disponibile=true;aggiorna()});
  window.addEventListener("appinstalled",function(){set(K_FATTO,"1");spegni()});
  var h=document.getElementById("sec-prima"); if(h&&window.MutationObserver){new MutationObserver(aggiorna).observe(h,{attributes:true,attributeFilter:["class"]})}
  var lb=document.getElementById("lb"); if(lb&&window.MutationObserver){new MutationObserver(aggiorna).observe(lb,{attributes:true,attributeFilter:["style","class"]})}
  window.addEventListener("hashchange",aggiorna); window.addEventListener("popstate",aggiorna);
  aggiorna();
})();
</script>
